[workspace]
exclude = ["vendor/cpal"]
members = ["crates/editbay-core", "crates/editbay-cli", "crates/editbay-media", "crates/editbay-render", "crates/editbay-audio", "crates/editbay-delivery", "crates/editbay-lab", "crates/editbay-ai", "crates/editbay-reference", "crates/editbay-automation", "crates/editbay-app", "vendor/eframe", "vendor/egui-winit"]
default-members = ["crates/editbay-core", "crates/editbay-cli", "crates/editbay-media", "crates/editbay-render", "crates/editbay-audio", "crates/editbay-delivery", "crates/editbay-lab", "crates/editbay-ai", "crates/editbay-reference", "crates/editbay-automation", "crates/editbay-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.25", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2.0"
fs2 = "0.4"
tempfile = "3.27"
rustix = { version = "1.1.5", features = ["fs"] }
wgpu = "=30.0.1"
pollster = "0.4"
half = "2.7"
fontdue = "=0.9.4"
cpal = { version = "=0.18.2", features = ["realtime-dbus", "pipewire"] }
cc = "1"
pkg-config = "0.3"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
libc = "0.2"
schemars = { version = "1", features = ["uuid1"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }

[patch.crates-io]
cpal = { path = "vendor/cpal" }
eframe = { path = "vendor/eframe" }
egui-winit = { path = "vendor/egui-winit" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.editbay-core]
opt-level = 2

[profile.dev.package.editbay-audio]
opt-level = 2

[profile.dev.package.fontdue]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
