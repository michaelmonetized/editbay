[workspace]
members = ["crates/editbay-core", "crates/editbay-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.25", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2.0"
fs2 = "0.4"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

