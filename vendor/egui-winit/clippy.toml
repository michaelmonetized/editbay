msrv = "1.95"
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false
max-fn-params-bools = 2
max-include-file-size = 1000000
type-complexity-threshold = 350
doc-valid-idents = ["AccessKit", "WebGL", "WebGL1", "WebGL2", "WebGPU", "VirtualBox", ".."]

disallowed-types = [
  { path = "winit::dpi::LogicalPosition", reason = "Egui zoom participates in native point conversion" },
  { path = "winit::dpi::LogicalSize", reason = "Egui zoom participates in native point conversion" },
]
